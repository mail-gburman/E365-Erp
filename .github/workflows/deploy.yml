name: Deploy to AWS EC2

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LIVE_APP_DIR: /opt/e365_erp/e365-erp-v8_9_10
      REPO_SLUG: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: LIVE_APP_DIR,REPO_SLUG,GH_TOKEN
          script: |
            set -euo pipefail
            APP_DIR="${LIVE_APP_DIR}"
            if [ -z "$APP_DIR" ]; then
              echo "LIVE_APP_DIR is empty"
              exit 1
            fi
            sudo mkdir -p "$APP_DIR"
            sudo mkdir -p "$APP_DIR/frontend/dist"
            sudo chown -R "$USER":"$USER" "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              TMP_DIR="$(mktemp -d)"
              git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git" "$TMP_DIR/repo"
              find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              cp -a "$TMP_DIR/repo/." "$APP_DIR/"
              rm -rf "$TMP_DIR"
            fi
            cd "$APP_DIR"

            # Pull latest code
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git" master
            git reset --hard FETCH_HEAD

            # Update backend dependencies
            cd backend
            if [ ! -f .venv/bin/activate ]; then
              rm -rf .venv
              if ! python3 -m venv .venv; then
                sudo apt-get update
                sudo apt-get install -y python3-venv
                rm -rf .venv
                python3 -m venv .venv
              fi
            fi
            source .venv/bin/activate
            python -m pip install --upgrade pip --quiet
            pip install -r requirements.txt --quiet
            cd ..
            rm -rf "$APP_DIR/frontend/dist"/*

      - name: Copy built frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "${{ env.LIVE_APP_DIR }}/frontend/dist"
          strip_components: 2

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: LIVE_APP_DIR
          script: |
            set -euo pipefail
            APP_DIR="${LIVE_APP_DIR}"
            if [ -z "$APP_DIR" ]; then
              echo "LIVE_APP_DIR is empty"
              exit 1
            fi
            cd "$APP_DIR"
            sudo systemctl restart e365-backend
            sleep 3
            sudo systemctl is-active e365-backend >/dev/null || (sudo journalctl -u e365-backend --no-pager -n 50 && exit 1)
            sudo systemctl reload nginx
